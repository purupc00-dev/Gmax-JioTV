<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d18">
  <title>Gmax-JioTV</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.0/dist/shaka-player.compiled.js" defer></script>
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">📺</div>
        <div>
          <div class="brand-title">Gmax-JioTV</div>
          <div class="brand-subtitle">Live TV</div>
        </div>
      </div>
      <div class="header-right">
        <span id="source-count">0 M3Us loaded</span>
        <span id="channel-count">0 channels</span>
        <span class="live-pill">● LIVE</span>
      </div>
    </header>

    <section id="player-section" class="player-section hidden">
      <div class="player-topbar">
        <div>
          <div class="playing-label">NOW PLAYING</div>
          <h2 id="playing-title">Select a channel</h2>
          <div id="playing-meta" class="playing-meta"></div>
        </div>
        <button id="close-player" class="close-button" type="button">Close</button>
      </div>

      <div class="video-container">
        <video id="video" playsinline webkit-playsinline preload="metadata"></video>

        <div id="aspect-controls" class="aspect-controls" aria-label="Video sizing">
          <button type="button" data-aspect="normal" class="aspect-button active">Normal</button>
          <button type="button" data-aspect="contain" class="aspect-button">Fit</button>
          <button type="button" data-aspect="fill" class="aspect-button">Fill</button>
          <button type="button" data-aspect="stretch" class="aspect-button">Stretch</button>
        </div>

        <div id="player-loading" class="player-overlay hidden" aria-live="polite">
          <div class="spinner"></div>
          <span id="player-loading-text">Connecting to live stream…</span>
        </div>

        <div id="player-empty" class="player-empty">
          <div class="empty-icon">📺</div>
          <div class="empty-title">Select a channel</div>
          <div class="empty-subtitle">Your selected channel will appear here.</div>
        </div>
      </div>

      <div id="player-error" class="player-error hidden"></div>
      <div id="source-status" class="source-status" aria-live="polite"></div>
    </section>

    <section id="recent-section" class="recent-section hidden">
      <div class="section-heading-row recent-heading">
        <div>
          <div class="section-kicker">YOUR TV</div>
          <h2>Recently Watched</h2>
        </div>
        <div class="recent-hint">Swipe →</div>
      </div>
      <div id="recent-grid" class="recent-grid"></div>
    </section>

    <section class="toolbar">
      <div class="search-wrapper">
        <span class="search-icon">🔎</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="Search channels...">
      </div>
    </section>

    <section class="category-section">
      <div class="section-label">CATEGORIES</div>
      <div id="category-list" class="category-list"></div>
    </section>

    <section class="channels-section">
      <div class="section-heading-row">
        <div>
          <div class="section-kicker">JIO TV</div>
          <h2>Live Channels</h2>
        </div>
        <div id="results-count" class="results-count">0 channels</div>
      </div>
      <div id="channels-grid" class="channels-grid"></div>
      <div id="load-more" class="load-more hidden">
        <button id="load-more-button" type="button">LOAD MORE CHANNELS</button>
      </div>
    </section>

    <footer class="footer">
      <span>Gmax-JioTV</span>
      <span>Powered by GmaxHub</span>
    </footer>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
