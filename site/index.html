<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d18">
  <title>Gmax-JioTV</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Shaka Player -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.0/dist/shaka-player.compiled.js" defer></script>
</head>

<body>
  <div class="page">
    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">📺</div>
        <div>
          <div class="brand-title">Gmax-JioTV</div>
          <div class="brand-subtitle">Live TV</div>
        </div>
      </div>
      <div class="header-right">
        <span id="channel-count">0 channels</span>
        <span class="live-pill">● LIVE</span>
      </div>
    </header>

    <!-- PLAYER -->
    <section id="player-section" class="player-section hidden">
      <div class="player-topbar">
        <div>
          <div class="playing-label">NOW PLAYING</div>
          <h2 id="playing-title">Select a channel</h2>
          <div id="playing-meta" class="playing-meta"></div>
        </div>
        <button id="close-player" class="close-button" type="button">Close</button>
      </div>

      <div class="video-container">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="player-loading" class="player-overlay hidden">
          <div class="spinner"></div>
          <span>Loading stream...</span>
        </div>
        <div id="player-empty" class="player-empty">
          <div class="empty-icon">📺</div>
          <div class="empty-title">Select a channel</div>
          <div class="empty-subtitle">Your selected channel will appear here.</div>
        </div>
      </div>

      <div id="player-error" class="player-error hidden"></div>
    </section>

    <!-- SEARCH -->
    <section class="toolbar">
      <div class="search-wrapper">
        <span class="search-icon">🔎</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="Search channels...">
      </div>
    </section>

    <!-- CATEGORIES -->
    <section class="category-section">
      <div class="section-label">CATEGORIES</div>
      <div id="category-list" class="category-list"></div>
    </section>

    <!-- CHANNEL SECTION -->
    <section class="channels-section">
      <div class="section-heading-row">
        <div>
          <div class="section-kicker">JIO TV</div>
          <h2>Live Channels</h2>
        </div>
        <div id="results-count" class="results-count">0 channels</div>
      </div>
      <div id="channels-grid" class="channels-grid"></div>
      <div id="load-more" class="load-more hidden">
        <button id="load-more-button" type="button">LOAD MORE CHANNELS</button>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <span>Gmax-JioTV</span>
      <span>Powered by GmaxHub</span>
    </footer>
  </div>

  <!-- INLINED APP LOGIC: Hides app.js from the Network Tab -->
  <script>
    "use strict";

    const CHANNELS_URL = "./channels.json";
    const CHANNELS_PER_PAGE = 60;
    const LIVE_DELAY_SECONDS = 15;
    const BUFFERING_GOAL_SECONDS = 25;
    const REBUFFERING_GOAL_SECONDS = 6;
    const BUFFER_BEHIND_SECONDS = 45;

    let allChannels = [];
    let filteredChannels = [];
    let activeCategory = "ALL";
    let visibleCount = CHANNELS_PER_PAGE;
    let shakaPlayer = null;
    let currentChannel = null;
    let playerUiShell = null;
    let playerControls = null;
    let qualityMenu = null;
    let playerUiTimer = null;
    let liveStatusTimer = null;
    let infiniteScrollObserver = null;
    let infiniteScrollBusy = false;
    let lastStreamUrl = "";
    let lastStreamType = "";
    let isPlayerRetrying = false;

    const favorites = new Set(JSON.parse(localStorage.getItem("gmax-jiotv-favorites") || "[]"));

    const channelsGrid = document.getElementById("channels-grid");
    const categoryList = document.getElementById("category-list");
    const searchInput = document.getElementById("search-input");
    const channelCount = document.getElementById("channel-count");
    const resultsCount = document.getElementById("results-count");
    const loadMore = document.getElementById("load-more");
    const loadMoreButton = document.getElementById("load-more-button");
    const playerSection = document.getElementById("player-section");
    const video = document.getElementById("video");
    const playingTitle = document.getElementById("playing-title");
    const playingMeta = document.getElementById("playing-meta");
    const playerLoading = document.getElementById("player-loading");
    const playerEmpty = document.getElementById("player-empty");
    const playerError = document.getElementById("player-error");
    const closePlayerButton = document.getElementById("close-player");

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function streamType(channel) {
      const url = String(channel?.stream_url || channel?.url || "").toLowerCase();
      if (url.includes(".mpd")) return "dash";
      if (url.includes(".m3u8")) return "hls";
      return "unknown";
    }

    function getStreamUrl(channel) {
      return (channel?.stream_url || channel?.url || "");
    }

    function getCategory(channel) {
      return (channel?.category || channel?.group || "Entertainment");
    }

    function saveFavorites() {
      localStorage.setItem("gmax-jiotv-favorites", JSON.stringify([...favorites]));
    }

    function getChannelLogo(channel) {
      return (channel?.logo || channel?.tvg_logo || "");
    }

    function getChannelId(channel) {
      return String(channel?.id || channel?.tvgId || "");
    }

    function getLiveSeekRange() {
      if (!shakaPlayer || typeof shakaPlayer.seekRange !== "function") return null;
      try {
        const range = shakaPlayer.seekRange();
        if (!range || !Number.isFinite(range.end)) return null;
        return range;
      } catch (error) {
        return null;
      }
    }

    function getCurrentLiveLag() {
      const range = getLiveSeekRange();
      if (!range || !Number.isFinite(video.currentTime)) return null;
      return Math.max(0, range.end - video.currentTime);
    }

    function getTargetLiveTime() {
      const range = getLiveSeekRange();
      if (!range) return null;
      return Math.max(range.start, range.end - LIVE_DELAY_SECONDS);
    }

    function seekToConfiguredLivePosition() {
      const target = getTargetLiveTime();
      if (target === null) return false;
      try {
        shakaPlayer.seek(target);
        return true;
      } catch (error) {
        try {
          video.currentTime = target;
          return true;
        } catch (fallbackError) {
          return false;
        }
      }
    }

    function toggleFavorite(channelId) {
      const key = String(channelId);
      if (favorites.has(key)) {
        favorites.delete(key);
      } else {
        favorites.add(key);
      }
      saveFavorites();
      renderChannels();
    }

    function buildCategories() {
      const categories = new Set();
      for (const channel of allChannels) {
        const category = getCategory(channel);
        if (category) categories.add(category);
      }
      const sorted = [...categories].sort((a, b) => String(a).localeCompare(String(b)));
      categoryList.innerHTML = "";
      const allButton = createCategoryButton("ALL", true);
      categoryList.appendChild(allButton);
      for (const category of sorted) {
        categoryList.appendChild(createCategoryButton(category, false));
      }
    }

    function createCategoryButton(category, active) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "category-button" + (active ? " active" : "");
      button.textContent = String(category);
      button.addEventListener("click", () => {
        activeCategory = category;
        visibleCount = CHANNELS_PER_PAGE;
        if (infiniteScrollObserver) {
          infiniteScrollObserver.disconnect();
          infiniteScrollObserver = null;
        }
        const oldSentinel = document.getElementById("gmax-infinite-scroll-sentinel");
        if (oldSentinel) oldSentinel.remove();
        document.querySelectorAll(".category-button").forEach(item => {
          item.classList.toggle("active", item.textContent === String(category));
        });
        applyFilters();
      });
      return button;
    }

    function applyFilters() {
      const query = normalize(searchInput.value);
      filteredChannels = allChannels.filter(channel => {
        const category = getCategory(channel);
        const matchesCategory = activeCategory === "ALL" || normalize(category) === normalize(activeCategory);
        if (!matchesCategory) return false;
        if (!query) return true;
        const searchable = [channel.name, channel.id, channel.group, channel.category, channel.language, channel.country].map(normalize).join(" ");
        return searchable.includes(query);
      });
      resultsCount.textContent = `${filteredChannels.length.toLocaleString()} channels`;
      visibleCount = Math.min(visibleCount, filteredChannels.length);
      renderChannels();
    }

    function renderChannels() {
      const visible = filteredChannels.slice(0, visibleCount);
      channelsGrid.innerHTML = "";
      if (visible.length === 0) {
        channelsGrid.innerHTML = `<div class="empty-grid">No channels found.</div>`;
        hideLoadMore();
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const channel of visible) {
        const card = createChannelCard(channel);
        fragment.appendChild(card);
      }
      channelsGrid.appendChild(fragment);
      hideLoadMore();
      ensureInfiniteScrollObserver();
    }

    function createChannelCard(channel) {
      const card = document.createElement("article");
      card.className = "channel-card";
      const id = getChannelId(channel) || String(Math.random());
      const favorite = favorites.has(id);
      const logo = getChannelLogo(channel);
      const group = channel.group || channel.groupTitle || getCategory(channel);
      card.innerHTML = `
        <button class="favorite-button ${favorite ? "active" : ""}" type="button" aria-label="Favorite">${favorite ? "♥" : "♡"}</button>
        <div class="channel-logo-wrap">
          ${logo ? `<img class="channel-logo" src="${escapeHtml(logo)}" alt="${escapeHtml(channel.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">` : ""}
          <div class="channel-fallback" style="display:${logo ? "none" : "flex"};">TV</div>
        </div>
        <div class="channel-info">
          <div class="channel-name">${escapeHtml(channel.name || "Unknown Channel")}</div>
          <div class="channel-meta">JIO TV • ${escapeHtml(channel.country || "INDIA")} • ${escapeHtml(group)}</div>
        </div>
      `;
      const favoriteButton = card.querySelector(".favorite-button");
      favoriteButton.addEventListener("click", event => {
        event.stopPropagation();
        toggleFavorite(id);
      });
      card.addEventListener("click", () => {
        openChannel(channel);
      });
      return card;
    }

    async function destroyPlayer() {
      stopLiveStatusTimer();
      hidePlayerErrorOverlay();
      if (shakaPlayer) {
        try { await shakaPlayer.destroy(); } catch (error) { console.warn("Shaka destroy failed:", error); }
        shakaPlayer = null;
      }
      if (playerUiShell) playerUiShell.classList.remove("gmax-controls-hidden");
    }

    function showPlayerLoading(state) {
      if (playerLoading) playerLoading.classList.toggle("hidden", !state);
      if (state) showPlayerSpinner(); else hidePlayerSpinner();
    }

    function showPlayerError(message) {
      playerError.textContent = message;
      playerError.classList.remove("hidden");
      showPlayerErrorOverlay(message);
    }

    function clearPlayerError() {
      playerError.textContent = "";
      playerError.classList.add("hidden");
      hidePlayerErrorOverlay();
    }

    async function openChannel(channel) {
      currentChannel = channel;
      const id = channel.id || channel.tvgId;
      let streamUrl = getStreamUrl(channel);

      if (channel.cookie && channel.cookie.includes("__hdnea__=")) {
        const separator = streamUrl.includes("?") ? "&" : "?";
        streamUrl = `${streamUrl}${separator}${channel.cookie}`;
      }

      if (!streamUrl) {
        showPlayerError("This channel does not contain a playable stream URL.");
        return;
      }

      lastStreamUrl = streamUrl;
      lastStreamType = streamType(channel);
      playerSection.classList.remove("hidden");
      playerEmpty.classList.add("hidden");
      playingTitle.textContent = channel.name || "Channel";
      playingMeta.textContent = ["JIO TV", channel.country || "INDIA", getCategory(channel)].filter(Boolean).join(" • ");
      clearPlayerError();
      showPlayerLoading(true);
      history.replaceState(null, "", `?id=${encodeURIComponent(id || "")}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
      await destroyPlayer();

      try {
        if (lastStreamType === "dash") {
          await playDash(streamUrl);
        } else if (lastStreamType === "hls") {
          await playHls(streamUrl);
        } else {
          throw new Error(`Unsupported stream format:\n${streamUrl}`);
        }
      } catch (error) {
        console.error("Playback failed:", error);
        showPlayerError(error instanceof Error ? error.message : String(error));
      } finally {
        showPlayerLoading(false);
      }
    }

    async function playDash(streamUrl) {
      if (!window.shaka) throw new Error("Shaka Player has not loaded yet.");
      if (!shaka.Player.isBrowserSupported()) throw new Error("This browser does not support Shaka Player.");
      
      shakaPlayer = new shaka.Player();
      shakaPlayer.configure({
        streaming: {
          bufferingGoal: BUFFERING_GOAL_SECONDS,
          rebufferingGoal: REBUFFERING_GOAL_SECONDS,
          bufferBehind: BUFFER_BEHIND_SECONDS
        }
      });
      await shakaPlayer.attach(video);
      shakaPlayer.addEventListener("error", event => console.error("Shaka error:", event.detail));

      let hdneaCookie = null;
      if (currentChannel && currentChannel.cookie && currentChannel.cookie.includes("__hdnea__=")) {
        hdneaCookie = currentChannel.cookie;
      }

      if (hdneaCookie) {
        const networkingEngine = shakaPlayer.getNetworkingEngine();
        if (networkingEngine) {
          networkingEngine.registerRequestFilter((requestType, request) => {
            const isManifest = requestType === shaka.net.NetworkingEngine.RequestType.MANIFEST;
            const isSegment = requestType === shaka.net.NetworkingEngine.RequestType.SEGMENT;
            if (isManifest || isSegment) {
              request.uris = request.uris.map(uri => {
                if (!uri || uri.includes("__hdnea__=")) return uri;
                const separator = uri.includes("?") ? "&" : "?";
                return (uri + separator + hdneaCookie);
              });
            }
          });
        }
      }

      if (currentChannel && currentChannel.key_id && currentChannel.key) {
        const clearKeys = {};
        clearKeys[currentChannel.key_id] = currentChannel.key;
        shakaPlayer.configure({ drm: { clearKeys } });
      }

      await shakaPlayer.load(streamUrl);
      seekToConfiguredLivePosition();
      video.controls = false;
      setupCinematicPlayer();
      updateQualityOptions();
      startLiveStatusTimer();
      updatePlayerUi();
      await video.play().catch(() => {});
    }

    async function playHls(streamUrl) {
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = streamUrl;
        video.controls = false;
        setupCinematicPlayer();
        updateQualityOptions();
        startLiveStatusTimer();
        await waitForVideoReady();
        seekNativeHlsToDelayedLive();
        updatePlayerUi();
        await video.play().catch(() => {});
        return;
      }

      if (window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        shakaPlayer.configure({
          streaming: {
            bufferingGoal: BUFFERING_GOAL_SECONDS,
            rebufferingGoal: REBUFFERING_GOAL_SECONDS,
            bufferBehind: BUFFER_BEHIND_SECONDS
          }
        });
        await shakaPlayer.attach(video);
        shakaPlayer.addEventListener("error", event => console.error("Shaka HLS error:", event.detail));

        if (currentChannel && currentChannel.cookie && currentChannel.cookie.includes("__hdnea__=")) {
          const hdneaCookie = currentChannel.cookie;
          const networkingEngine = shakaPlayer.getNetworkingEngine();
          if (networkingEngine) {
            networkingEngine.registerRequestFilter((requestType, request) => {
              const isManifest = requestType === shaka.net.NetworkingEngine.RequestType.MANIFEST;
              const isSegment = requestType === shaka.net.NetworkingEngine.RequestType.SEGMENT;
              if (isManifest || isSegment) {
                request.uris = request.uris.map(uri => {
                  if (!uri || uri.includes("__hdnea__=")) return uri;
                  const separator = uri.includes("?") ? "&" : "?";
                  return (uri + separator + hdneaCookie);
                });
              }
            });
          }
        }

        await shakaPlayer.load(streamUrl);
        seekToConfiguredLivePosition();
        video.controls = false;
        setupCinematicPlayer();
        updateQualityOptions();
        startLiveStatusTimer();
        updatePlayerUi();
        await video.play().catch(() => {});
        return;
      }
      throw new Error("This browser cannot play HLS.");
    }

    function seekNativeHlsToDelayedLive() {
      try {
        const duration = video.duration;
        if (!Number.isFinite(duration) || duration <= 0) return false;
        const target = Math.max(0, duration - LIVE_DELAY_SECONDS);
        video.currentTime = target;
        return true;
      } catch (error) {
        return false;
      }
    }

    function waitForVideoReady() {
      return new Promise(resolve => {
        if (video.readyState >= 2) { resolve(); return; }
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          video.removeEventListener("loadedmetadata", finish);
          video.removeEventListener("canplay", finish);
          resolve();
        };
        video.addEventListener("loadedmetadata", finish, { once: true });
        video.addEventListener("canplay", finish, { once: true });
        setTimeout(finish, 5000);
      });
    }

        .gmax-related-title { color: #fff; font: 900 17px/1.2 system-ui, sans-serif; margin-bottom: 9px; }
        .gmax-related-row { display: flex; gap: 11px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
        .gmax-related-card { flex: 0 0 155px; min-height: 92px; border: 1px solid rgba(255,255,255,.07); background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.025)); border-radius: 12px; overflow: hidden; cursor: pointer; transition: .18s ease; }
        .gmax-related-card:hover { transform: translateY(-2px); border-color: rgba(255,43,131,.35); }
        .gmax-related-image { width: 100%; height: 55px; object-fit: contain; background: #0b0b0e; padding: 8px; }
        .gmax-related-name { padding: 7px 9px; color: rgba(255,255,255,.9); font: 800 11px/1.2 system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 700px) {
          .gmax-player-shell { border-radius: 10px; min-height: 210px; }
          .gmax-player-top { padding: 10px; }
          .gmax-channel-art { width: 42px; height: 42px; border-radius: 9px; }
          .gmax-now-title { max-width: 48vw; }
          .gmax-now-meta { display: none; }
          .gmax-live-badge { padding: 7px 9px; }
          .gmax-player-controls { gap: 6px; padding: 58px 9px 9px; }
          .gmax-volume, .gmax-live-lag { display: none; }
          .gmax-player-button { width: 34px; height: 34px; }
          .gmax-go-live { padding: 8px 9px; }
          .gmax-related-card { flex-basis: 135px; }
        }
      `;
      document.head.appendChild(style);
    }

    function setupCinematicPlayer() {
      injectCinematicPlayerStyles();
      let shell = video.closest(".gmax-player-shell");
      if (!shell) {
        const parent = video.parentElement;
        if (!parent) return;
        shell = document.createElement("div");
        shell.className = "gmax-player-shell";
        parent.insertBefore(shell, video);
        shell.appendChild(video);
      }
      playerUiShell = shell;
      if (!playerControls) createPlayerControls(shell);
      updatePlayerIdentity();
      buildRelatedChannels();
      hidePlayerErrorOverlay();
    }

    function createPlayerControls(shell) {
      const gradient = document.createElement("div");
      gradient.className = "gmax-player-gradient";
      shell.appendChild(gradient);

      const top = document.createElement("div");
      top.className = "gmax-player-top";
      top.innerHTML = `
        <div class="gmax-now-playing">
          <img class="gmax-channel-art" data-role="channel-art" alt="">
          <div class="gmax-now-copy">
            <div class="gmax-now-label">NOW PLAYING</div>
            <div class="gmax-now-title" data-role="channel-title">Live TV</div>
            <div class="gmax-now-meta" data-role="channel-meta">JIO TV</div>
          </div>
        </div>
        <div class="gmax-live-badge" title="Live"><span class="gmax-live-dot"></span> LIVE</div>
      `;
      shell.appendChild(top);

      const spinner = document.createElement("div");
      spinner.className = "gmax-spinner";
      spinner.dataset.role = "spinner";
      shell.appendChild(spinner);

      const errorOverlay = document.createElement("div");
      errorOverlay.className = "gmax-player-error";
      errorOverlay.dataset.role = "error";
      errorOverlay.innerHTML = `
        <div class="gmax-error-title">Playback problem</div>
        <div class="gmax-error-message" data-role="error-message">The channel could not be played.</div>
        <button class="gmax-retry-button" data-action="retry" type="button">RECONNECT</button>
      `;
      shell.appendChild(errorOverlay);

      const controls = document.createElement("div");
      controls.className = "gmax-player-controls";
      controls.innerHTML = `
        <button class="gmax-player-button" data-action="play" type="button" title="Play / Pause">▶</button>
        <button class="gmax-player-button" data-action="mute" type="button" title="Mute">🔊</button>
        <input class="gmax-volume" data-action="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <span class="gmax-live-lag" data-role="live-lag">LIVE • -15s</span>
        <button class="gmax-go-live" data-action="go-live" type="button" title="Return to the live safety position">GO LIVE</button>
        <span class="gmax-player-spacer"></span>
        <div class="gmax-quality-wrap">
          <button class="gmax-player-button" data-action="quality" type="button" title="Quality">⚙</button>
          <div class="gmax-quality-menu" data-role="quality-menu"></div>
        </div>
        <button class="gmax-player-button" data-action="fullscreen" type="button" title="Fullscreen">⛶</button>
      `;
      shell.appendChild(controls);

      playerControls = controls;
      qualityMenu = controls.querySelector('[data-role="quality-menu"]');

      controls.querySelector('[data-action="play"]').addEventListener("click", async event => {
        event.stopPropagation();
        if (video.paused) {
          await video.play().catch(() => {});
        } else {
          video.pause();
        }
        updatePlayerUi();
      });

      controls.querySelector('[data-action="mute"]').addEventListener("click", event => {
        event.stopPropagation();
        video.muted = !video.muted;
        updatePlayerUi();
      });

      controls.querySelector('[data-action="volume"]').addEventListener("input", event => {
        event.stopPropagation();
        video.volume = Number(event.target.value);
        video.muted = video.volume === 0;
        updatePlayerUi();
      });

      controls.querySelector('[data-action="go-live"]').addEventListener("click", event => {
        event.stopPropagation();
        if (seekToConfiguredLivePosition()) {
          video.play().catch(() => {});
        }
        updatePlayerUi();
      });

      controls.querySelector('[data-action="quality"]').addEventListener("click", event => {
        event.stopPropagation();
        qualityMenu.classList.toggle("open");
      });

      controls.querySelector('[data-action="fullscreen"]').addEventListener("click", event => {
        event.stopPropagation();
        toggleFullscreen();
      });

      errorOverlay.querySelector('[data-action="retry"]').addEventListener("click", event => {
        event.stopPropagation();
        retryCurrentChannel();
      });

      shell.addEventListener("dblclick", event => {
        if (event.target.closest(".gmax-player-controls")) return;
        toggleFullscreen();
      });

      shell.addEventListener("click", event => {
        if (event.target !== video) return;
        if (video.paused) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });

      ["play", "pause", "timeupdate", "loadedmetadata", "volumechange", "durationchange", "progress", "canplay"].forEach(eventName => {
        video.addEventListener(eventName, updatePlayerUi);
      });

      shell.addEventListener("mousemove", () => {
        showPlayerControlsTemporarily();
      });

      shell.addEventListener("touchstart", () => {
        showPlayerControlsTemporarily();
      }, { passive: true });

      document.addEventListener("click", event => {
        if (!qualityMenu) return;
        if (!event.target.closest(".gmax-quality-wrap")) {
          qualityMenu.classList.remove("open");
        }
      });

      window.addEventListener("keydown", handlePlayerKeyboard);
    }

    function updatePlayerIdentity() {
      if (!playerUiShell || !currentChannel) return;
      const art = playerUiShell.querySelector('[data-role="channel-art"]');
      const title = playerUiShell.querySelector('[data-role="channel-title"]');
      const meta = playerUiShell.querySelector('[data-role="channel-meta"]');
      const logo = getChannelLogo(currentChannel);

      if (art) {
        if (logo) {
          art.src = logo;
          art.style.display = "block";
        } else {
          art.removeAttribute("src");
          art.style.display = "none";
        }
      }
      if (title) title.textContent = currentChannel.name || "Live TV";
      if (meta) {
        meta.textContent = ["JIO TV", currentChannel.country || "INDIA", getCategory(currentChannel)].filter(Boolean).join(" • ");
      }
    }

    function buildRelatedChannels() {
      if (!playerSection || !currentChannel) return;
      let info = playerSection.querySelector(".gmax-player-info");
      if (!info) {
        info = document.createElement("div");
        info.className = "gmax-player-info";
        playerSection.appendChild(info);
      }
      const logo = getChannelLogo(currentChannel);
      const related = allChannels
        .filter(channel => getChannelId(channel) !== getChannelId(currentChannel))
        .filter(channel => normalize(getCategory(channel)) === normalize(getCategory(currentChannel)))
        .slice(0, 12);

      info.innerHTML = `
        <div class="gmax-player-info-main">
          ${logo ? `<img class="gmax-info-logo" src="${escapeHtml(logo)}" alt="" referrerpolicy="no-referrer">` : ""}
          <div>
            <div class="gmax-info-label">NOW PLAYING</div>
            <div class="gmax-info-title">${escapeHtml(currentChannel.name || "Live TV")}</div>
            <div class="gmax-info-meta">${escapeHtml(["JIO TV", currentChannel.country || "INDIA", getCategory(currentChannel)].filter(Boolean).join(" • "))}</div>
          </div>
        </div>
        ${related.length ? `
          <div>
            <div class="gmax-related-title">RELATED CHANNELS</div>
            <div class="gmax-related-row">
              ${related.map(channel => {
                const channelLogo = getChannelLogo(channel);
                return `
                  <div class="gmax-related-card" data-related-channel="${escapeHtml(getChannelId(channel))}">
                    ${channelLogo ? `<img class="gmax-related-image" src="${escapeHtml(channelLogo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="gmax-related-image" style="display:grid; place-items:center; color:#777; font-weight:800;">TV</div>`}
                    <div class="gmax-related-name">${escapeHtml(channel.name || "Channel")}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        ` : ""}
      `;

      info.querySelectorAll("[data-related-channel]").forEach(card => {
        card.addEventListener("click", () => {
          const id = card.dataset.relatedChannel;
          const channel = allChannels.find(item => getChannelId(item) === String(id));
          if (channel) openChannel(channel);
        });
      });
    }

    function showPlayerControlsTemporarily() {
      if (!playerUiShell) return;
      playerUiShell.classList.remove("gmax-controls-hidden");
      clearTimeout(playerUiTimer);
      playerUiTimer = setTimeout(() => {
        if (!video.paused) playerUiShell.classList.add("gmax-controls-hidden");
      }, 2800);
    }

    function toggleFullscreen() {
      if (!playerUiShell) return;
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else {
        if (playerUiShell.requestFullscreen) {
          playerUiShell.requestFullscreen().catch(() => {});
        }
      }
    }

    function handlePlayerKeyboard(event) {
      if (!playerUiShell || playerSection.classList.contains("hidden")) return;
      const target = event.target;
      if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
      const key = String(event.key).toLowerCase();

      if (key === " ") {
        event.preventDefault();
        if (video.paused) video.play().catch(() => {});
        else video.pause();
        updatePlayerUi();
      } else if (key === "m") {
        video.muted = !video.muted;
        updatePlayerUi();
      } else if (key === "f") {
        toggleFullscreen();
      } else if (key === "g") {
        seekToConfiguredLivePosition();
      } else if (key === "arrowup") {
        event.preventDefault();
        video.volume = Math.min(1, video.volume + 0.05);
        video.muted = false;
        updatePlayerUi();
      } else if (key === "arrowdown") {
        event.preventDefault();
        video.volume = Math.max(0, video.volume - 0.05);
        updatePlayerUi();
      }
      showPlayerControlsTemporarily();
    }

    function showPlayerSpinner() {
      if (!playerUiShell) return;
      const spinner = playerUiShell.querySelector('[data-role="spinner"]');
      if (spinner) spinner.style.display = "block";
    }

    function hidePlayerSpinner() {
      if (!playerUiShell) return;
      const spinner = playerUiShell.querySelector('[data-role="spinner"]');
      if (spinner) spinner.style.display = "none";
    }

    function showPlayerErrorOverlay(message) {
      if (!playerUiShell) return;
      const overlay = playerUiShell.querySelector('[data-role="error"]');
      if (!overlay) return;
      const messageElement = overlay.querySelector('[data-role="error-message"]');
      if (messageElement) messageElement.textContent = message || "The channel could not be played.";
      overlay.classList.add("open");
    }

    function hidePlayerErrorOverlay() {
      if (!playerUiShell) return;
      const overlay = playerUiShell.querySelector('[data-role="error"]');
      if (overlay) overlay.classList.remove("open");
    }

    async function retryCurrentChannel() {
      if (isPlayerRetrying || !currentChannel) return;
      isPlayerRetrying = true;
      showPlayerLoading(true);
      clearPlayerError();
      try {
        await destroyPlayer();
        if (lastStreamType === "dash") await playDash(lastStreamUrl);
        else if (lastStreamType === "hls") await playHls(lastStreamUrl);
        else throw new Error("Unsupported stream format.");
      } catch (error) {
        showPlayerError(error instanceof Error ? error.message : String(error));
      } finally {
        isPlayerRetrying = false;
        showPlayerLoading(false);
      }
    }

    function startLiveStatusTimer() {
      stopLiveStatusTimer();
      liveStatusTimer = setInterval(() => { updateLiveStatus(); }, 1000);
      updateLiveStatus();
    }

    function stopLiveStatusTimer() {
      if (liveStatusTimer) {
        clearInterval(liveStatusTimer);
        liveStatusTimer = null;
      }
    }

    function updateLiveStatus() {
      if (!playerControls) return;
      const lagElement = playerControls.querySelector('[data-role="live-lag"]');
      if (!lagElement) return;
      const lag = getCurrentLiveLag();
      if (lag === null) {
        lagElement.textContent = `LIVE • -${LIVE_DELAY_SECONDS}s`;
        return;
      }
      const rounded = Math.max(0, Math.round(lag));
      lagElement.textContent = `LIVE • -${rounded}s`;
    }

    function updateQualityOptions() {
      if (!qualityMenu) return;
      if (!shakaPlayer || typeof shakaPlayer.getVariantTracks !== "function") {
        qualityMenu.innerHTML = `
          <button class="gmax-quality-item active" type="button">Auto</button>
          <button class="gmax-quality-item" type="button" disabled>Native HLS</button>
        `;
        return;
      }
      const tracks = shakaPlayer.getVariantTracks().filter(track => track && track.video && track.height);
      const bestByResolution = new Map();
      for (const track of tracks) {
        const height = Number(track.height);
        const existing = bestByResolution.get(height);
        if (!existing || Number(track.bandwidth || 0) > Number(existing.bandwidth || 0)) {
          bestByResolution.set(height, track);
        }
      }
      const uniqueTracks = [...bestByResolution.values()].sort((a, b) => Number(b.height || 0) - Number(a.height || 0));

      qualityMenu.innerHTML = `
        <button class="gmax-quality-item active" data-quality="auto" type="button">Auto</button>
        ${uniqueTracks.map(track => {
          const fps = Number(track.frameRate || 0);
          return `<button class="gmax-quality-item" data-quality-track="${track.id}" type="button">${track.height}p${fps ? ` • ${Math.round(fps)}fps` : ""}</button>`;
        }).join("")}
      `;

      qualityMenu.querySelectorAll("[data-quality]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          if (button.dataset.quality === "auto") {
            shakaPlayer.configure({ abr: { enabled: true } });
            setActiveQualityButton(button);
            qualityMenu.classList.remove("open");
            return;
          }
        });
      });

      qualityMenu.querySelectorAll("[data-quality-track]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const trackId = Number(button.dataset.qualityTrack);
          const selected = tracks.find(track => Number(track.id) === trackId);
          if (!selected) return;
          shakaPlayer.configure({ abr: { enabled: false } });
          shakaPlayer.selectVariantTrack(selected, true, 0);
          setActiveQualityButton(button);
          qualityMenu.classList.remove("open");
        });
      });
    }

    function setActiveQualityButton(activeButton) {
      if (!qualityMenu) return;
      qualityMenu.querySelectorAll(".gmax-quality-item").forEach(item => {
        item.classList.toggle("active", item === activeButton);
      });
    }

    function updatePlayerUi() {
      if (!playerControls) return;
      const playButton = playerControls.querySelector('[data-action="play"]');
      const muteButton = playerControls.querySelector('[data-action="mute"]');
      const volumeInput = playerControls.querySelector('[data-action="volume"]');
      if (playButton) playButton.textContent = video.paused ? "▶" : "Ⅱ";
      if (muteButton) muteButton.textContent = video.muted || video.volume === 0 ? "🔇" : "🔊";
      if (volumeInput) volumeInput.value = String(video.volume);
      updateLiveStatus();
    }

    function ensureInfiniteScrollObserver() {
      if (infiniteScrollObserver) return;
      let sentinel = document.getElementById("gmax-infinite-scroll-sentinel");
      if (!sentinel) {
        sentinel = document.createElement("div");
        sentinel.id = "gmax-infinite-scroll-sentinel";
        sentinel.style.height = "1px";
        sentinel.style.width = "100%";
        channelsGrid.insertAdjacentElement("afterend", sentinel);
      }
      infiniteScrollObserver = new IntersectionObserver(entries => {
        const entry = entries[0];
        if (!entry.isIntersecting || infiniteScrollBusy || visibleCount >= filteredChannels.length) return;
        infiniteScrollBusy = true;
        visibleCount += CHANNELS_PER_PAGE;
        renderChannels();
        requestAnimationFrame(() => { infiniteScrollBusy = false; });
      }, { root: null, rootMargin: "1000px 0px", threshold: 0 });
      infiniteScrollObserver.observe(sentinel);
    }

    function hideLoadMore() {
      if (loadMore) { loadMore.classList.add("hidden"); loadMore.style.display = "none"; }
      if (loadMoreButton) { loadMoreButton.style.display = "none"; }
    }

    searchInput.addEventListener("input", () => {
      visibleCount = CHANNELS_PER_PAGE;
      if (infiniteScrollObserver) {
        infiniteScrollObserver.disconnect();
        infiniteScrollObserver = null;
      }
      const oldSentinel = document.getElementById("gmax-infinite-scroll-sentinel");
      if (oldSentinel) oldSentinel.remove();
      applyFilters();
    });

    function getRequestedChannelId() {
      return new URLSearchParams(window.location.search).get("id");
    }

    function openRequestedChannel() {
      const id = getRequestedChannelId();
      if (!id) return;
      const channel = allChannels.find(item => String(item.id ?? item.tvgId) === String(id));
      if (!channel) return;
      setTimeout(() => { openChannel(channel); }, 200);
    }

    closePlayerButton.addEventListener("click", async () => {
      await destroyPlayer();
      video.pause();
      video.removeAttribute("src");
      video.load();
      playerSection.classList.add("hidden");
      playerEmpty.classList.remove("hidden");
      clearPlayerError();
      currentChannel = null;
      lastStreamUrl = "";
      lastStreamType = "";
      const info = playerSection.querySelector(".gmax-player-info");
      if (info) info.remove();
      history.replaceState(null, "", window.location.pathname);
    });

    function parseM3U(text) {
      const lines = text.split('\n');
      const channels = [];
      let currentChannel = {};

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          currentChannel = {};
          const idMatch = line.match(/tvg-id="([^"]+)"/);
          if (idMatch) currentChannel.id = idMatch[1];
          const nameMatch = line.match(/tvg-name="([^"]+)"/);
          if (nameMatch) currentChannel.name = nameMatch[1];
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          if (logoMatch) currentChannel.logo = logoMatch[1];
          const groupMatch = line.match(/group-title="([^"]+)"/);
          if (groupMatch) currentChannel.group = groupMatch[1];
          if (!currentChannel.name && line.includes(',')) {
            currentChannel.name = line.substring(line.indexOf(',') + 1).trim();
          }
        } else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
          const keyStr = line.split('=')[1];
          if (keyStr && keyStr.includes(':')) {
            const parts = keyStr.split(':');
            currentChannel.key_id = parts[0].trim();
            currentChannel.key = parts[1].trim();
          }
        } else if (line.startsWith('#EXTHTTP:')) {
          try {
            const jsonStr = line.substring(9);
            const httpProps = JSON.parse(jsonStr);
            if (httpProps.cookie) {
              currentChannel.cookie = httpProps.cookie;
            }
          } catch (e) {
            console.warn("Failed to parse EXTHTTP JSON", e);
          }
        } else if (!line.startsWith('#')) {
          currentChannel.stream_url = line;
          channels.push(currentChannel);
          currentChannel = {};
        }
      }
      return channels;
    }

    async function loadChannels() {
      try {
        let loadedData = null;
        const DYNAMIC_M3U_URLS = ["../jtvplus6.m3u", "../jtvplus7.m3u", "../jtvplus8.m3u"];

        for (const url of DYNAMIC_M3U_URLS) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (response.ok) {
              const text = await response.text();
              loadedData = parseM3U(text);
              if (loadedData.length > 0) break;
            }
          } catch (e) {
            console.warn(`Failed to fetch dynamic M3U from ${url}`, e);
          }
        }

        if (!loadedData || loadedData.length === 0) {
          const response = await fetch(CHANNELS_URL, { cache: "no-store" });
          if (!response.ok) throw new Error(`channels.json returned HTTP ${response.status}`);
          loadedData = await response.json();
          if (!Array.isArray(loadedData)) throw new Error("channels.json is not an array.");
        }

        allChannels = loadedData.filter(channel => channel && (channel.name || channel.stream_url || channel.url));
        filteredChannels = [...allChannels];
        channelCount.textContent = `${allChannels.length.toLocaleString()} channels`;
        resultsCount.textContent = `${allChannels.length.toLocaleString()} channels`;

        buildCategories();
        applyFilters();
        openRequestedChannel();

      } catch (error) {
        console.error("Channel loading failed:", error);
        channelCount.textContent = "Failed to load";
        resultsCount.textContent = "0 channels";
        channelsGrid.innerHTML = `
          <div class="empty-grid">
            <strong>Failed to load Jio TV channels</strong>
            <br><br>
            <span>${escapeHtml(error instanceof Error ? error.message : String(error))}</span>
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      hideLoadMore();
      loadChannels();
    });
  </script>
