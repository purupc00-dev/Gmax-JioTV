name: Auto Update Channels JSON

on:
  schedule:
    # Refresh every 15 minutes so keys/cookies stay valid
    - cron: '*/15 * * * *'
  push:
    paths:
      - '*.m3u'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Update Script
        run: python update_json.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add site/channels.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update channels.json from M3U"
          git push
