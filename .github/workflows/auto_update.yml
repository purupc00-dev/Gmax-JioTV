name: Rebuild Channels JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rebuild channels.json from every M3U already in the repo
        run: python -c "from merge_m3u import main; main()"

      - name: Commit channels JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/channels.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Rebuild channels JSON"
          git push origin HEAD:main
