name: Auto Update Channels JSON

on:
  schedule:
    # Runs automatically every 3 hours (adjust if you want it faster)
    - cron: '0 */3 * * *'
  push:
    paths:
      # Also runs immediately whenever an M3U file is updated in the repo
      - '*.m3u'
  workflow_dispatch: # Allows you to click a button in GitHub to run it manually

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Update Script
        run: python update_json.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add site/channels.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update channels.json from M3U"
          git push
