name: Refresh All Live TV Sources

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-tv-all
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure common external modules are present just in case
          pip install requests bs4

      - name: Run Global Updater & Merger
        run: python update_and_merge.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add all M3U files and the merged JSON file
          git add '*.m3u' site/channels.json

          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No playlist or channel changes detected."
            exit 0
          fi

          git commit -m "Auto-refresh all live TV sources & merge channels.json"
          git push origin HEAD:main
