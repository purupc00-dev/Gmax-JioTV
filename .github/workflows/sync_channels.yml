name: Dynamic Channels JSON Generator

on:
  schedule:
    # Runs every 2 hours to pull refreshed hdnea/DRM keys
    - cron: '0 */2 * * *'
  push:
    paths:
      - '*.m3u'
      - '*.py'
  workflow_dispatch:

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run M3U to JSON Parser
        run: python merge_m3u.py

      - name: Commit and Push Updated channels.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add site/channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh site/channels.json with JTV 6, 7 & 8 feeds" && git push)
