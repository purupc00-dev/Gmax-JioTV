name: Refresh All Live TV Sources

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-tv-all
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Refresh every paired M3U and rebuild all channels
        run: python update_json.py

      - name: Commit refreshed playlists and merged channel JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.m3u' site/channels.json

          if git diff --cached --quiet; then
            echo "No playlist or channel changes."
            exit 0
          fi

          git commit -m "Auto-refresh all live TV sources"
          git push origin HEAD:main
