name: Update Sport Server 3

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 */3 * * *' # Fixed: Runs exactly every 3 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/Sport_S3.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-sport-s3
      cancel-in-progress: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Reset to Remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        env:
          TZ: Asia/Kolkata
        run: |
          python scripts/Sport_S3.py

      - name: Commit and Push Changes
        run: |
          # Safe abort if Python script failed to create the file
          if [ ! -f "Playlists/Sport_S3.m3u" ]; then
            echo "[-] Playlists/Sport_S3.m3u was not generated. Skipping commit."
            exit 1
          fi

          git add Playlists/Sport_S3.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "GmaxHub Sport S3 Updated ✅ ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          max_retries=5
          attempt=1

          until [ $attempt -gt $max_retries ]
          do
            echo "Push attempt $attempt..."
            git fetch origin main
            git rebase origin/main

            if git push origin main; then
              echo "Push succeeded."
              exit 0
            else
              echo "Push failed, retrying ($attempt/$max_retries)..."
              attempt=$((attempt+1))
              sleep $((RANDOM % 5 + 1))
            fi
          done

          echo "Push failed after $max_retries attempts."
          exit 1
