name: Update Plugx Playlist

on:
  schedule:
    # Runs automatically every 2 hours. You can adjust this if needed!
    - cron: '0 */2 * * *'
  # This allows you to manually click a "Run workflow" button on GitHub
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Plugx Fetcher Script
        run: python plugx.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugx.m3u
          
          # This checks if the file actually changed before committing, preventing errors!
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh Premium Plugx playlist" && git push)
